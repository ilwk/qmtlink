[project]
name = "qmtlink"
version = "0.1.0a22"
description = "An unofficial HTTP bridge for miniQMT/xtquant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QmtLink Contributors" }]
keywords = ["miniqmt", "qmt", "xtquant", "trading", "api", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.52.1",
    "numpy>=1.26.4,<3; sys_platform == 'win32'",
    "pandas>=2.2.0,<3; sys_platform == 'win32'",
    "xtquant==250807.1.2; sys_platform == 'win32'",
]

[project.scripts]
qmtlink = "qmtlink.server.runner:main"

[project.urls]
Homepage = "https://github.com/ilwk/qmtlink"
Repository = "https://github.com/ilwk/qmtlink"
Issues = "https://github.com/ilwk/qmtlink/issues"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
source-include = ["ROADMAP.md", "docs/**", "src/qmtlink/config.template.toml", "tests/**"]
