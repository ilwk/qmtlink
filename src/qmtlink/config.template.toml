# QmtLink 配置文件。
# 顶层 API key 由 QmtLink 自动生成，HTTP 调用方通过 X-API-Key 请求头使用。
# Windows 路径请使用单引号，例如：qmt_path = 'C:\miniQMT安装目录\userdata_mini'
# 也可以使用正斜杠，例如：qmt_path = "C:/miniQMT安装目录/userdata_mini"

api_key = '{{API_KEY}}'

[server]
# Bridge 监听地址。0.0.0.0 允许局域网访问，请确认防火墙和 API key 已妥善配置。
host = '0.0.0.0'
port = 8000
qmt_path = ''
account_id = ''
# 真实交易保护：保持 false；只有明确改为 true 且 API 请求携带 live=true 才允许下单。
allow_trading = false
# 控制台日志级别：DEBUG、INFO、WARNING、ERROR 或 CRITICAL。
log_level = 'INFO'
# 默认关闭逐请求访问日志，排查 HTTP 请求时再临时开启。
access_log = false
